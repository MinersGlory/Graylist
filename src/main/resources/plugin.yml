name: Graylist
main: de.bootko.graylist.Graylist
version: 1.3.0
api-version: '1.21'
author: Zethrus

commands:
    graylist:
      description: Root command to manage the graylist
      aliases: [glist]
      permission: graylist.admin

permissions:
    graylist.*:
        description: Grants full abilities to manage the graylist
        default: op
        children:
            graylist.bypass: true
            graylist.admin: true
            graylist.email: true
    graylist.bypass:
        description: Players with this bypass the graylist gate (approved players, staff)
        default: op
    graylist.admin:
        description: Manage the graylist (add/remove/list/reload)
        default: op
    graylist.email:
        description: Send welcome emails to players
        default: op
